<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — Going Beyond</title>
<meta name="description" content="Recent activity on your Going Beyond orders.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EFEDE2; --paper-alt:#E6E2D3; --ink:#1F2A38; --ink-soft:#4A5563;
    --carbon-red:#B23A2E; --stamp-mustard:#C9922A; --ledger-green:#4C6B54;
    --line:#C9C4B2; --white:#FFFDF8; --mono:'JetBrains Mono', monospace; --sans:'Work Sans', sans-serif;
  }
  [data-theme="dark"]{
    --paper:#171A1E; --paper-alt:#1E2228; --ink:#ECE8DC; --ink-soft:#A9A79B;
    --carbon-red:#E0574A; --stamp-mustard:#E0AC4D; --ledger-green:#7FA98C;
    --line:#3A3E44; --white:#20242A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5;}
  a{color:inherit; text-decoration:none;}
  header.nav{position:sticky; top:0; z-index:50; background:var(--white); border-bottom:1px solid var(--line);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:900px; margin:0 auto;}
  .back-link{font-family:var(--mono); font-size:.82rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .brand{font-weight:700; font-size:.95rem;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.95rem;}
  .page-head{padding:32px 24px 20px; text-align:center;}
  .page-head .eyebrow{font-family:var(--mono); font-size:.7rem; color:var(--carbon-red); font-weight:700; letter-spacing:.08em; margin-bottom:10px;}
  .page-head h1{font-size:1.4rem; font-weight:700;}
  .wrap{max-width:700px; margin:0 auto; padding:0 24px 60px;}
  .empty-state{text-align:center; padding:50px 10px; color:var(--ink-soft); font-size:.9rem;}
  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:var(--mono); font-size:.85rem;}

  .timeline{position:relative; padding-left:28px;}
  .timeline::before{content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .tl-item{position:relative; margin-bottom:20px;}
  .tl-item::before{content:''; position:absolute; left:-28px; top:3px; width:14px; height:14px; border-radius:50%; background:var(--white); border:2px solid var(--carbon-red);}
  .tl-item .evt{font-weight:600; font-size:.9rem;}
  .tl-item .meta{font-size:.76rem; color:var(--ink-soft); margin-top:2px;}
  footer{padding:32px 24px; text-align:center; border-top:1px solid var(--line);}
  footer p{color:var(--ink-soft); font-size:.8rem;}
</style>
</head>
<body data-theme="light">
<header class="nav">
  <div class="nav-inner">
    <a href="account.html" class="back-link">← My Account</a>
    <div class="brand">GOING BEYOND</div>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>
<div class="page-head">
  <div class="eyebrow">CLIENT ACCOUNT</div>
  <h1>Activity</h1>
</div>
<div class="wrap">
  <div id="activityArea"><div class="loading">Loading your activity…</div></div>
</div>
<footer><p>&copy; Going Beyond</p></footer>
<script>
  const SUPABASE_URL = "https://ysujkmmwwknjraofcixr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzdWprbW13d2tuanJhb2ZjaXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDQ4NzksImV4cCI6MjA5ODgyMDg3OX0.t8WpzFmQpE2kJj5w0XuVZV5QeeAcYCpJZspgqnJjNFU";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  function fmtDateTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }

  async function init(){
    const { data } = await sb.auth.getSession();
    const session = data.session;
    if (!session) { window.location.href = 'login.html?next=activity.html'; return; }

    try {
      const res = await fetch('/api/my-orders', { headers: { Authorization: `Bearer ${session.access_token}` } });
      const result = await res.json();
      const area = document.getElementById('activityArea');
      if (!res.ok || !result.success || !result.orders.length) {
        area.innerHTML = `<div class="empty-state">No activity yet.</div>`;
        return;
      }

      const events = [];
      result.orders.forEach(o => {
        events.push({ time: o.created_at, text: `Order placed — ${o.order_number}`, meta: o.service });
        if (o.revision_requested_at) {
          events.push({ time: o.revision_requested_at, text: `Revision requested — ${o.order_number}`, meta: o.revision_notes || '' });
        }
        if (o.delivery_file_uploaded_at) {
          events.push({ time: o.delivery_file_uploaded_at, text: `Files delivered — ${o.order_number}`, meta: 'Available to download in My Orders' });
        }
      });

      events.sort((a, b) => new Date(b.time) - new Date(a.time));

      area.innerHTML = `<div class="timeline">` + events.map(e => `
        <div class="tl-item">
          <div class="evt">${e.text}</div>
          <div class="meta">${fmtDateTime(e.time)}${e.meta ? ' · ' + e.meta : ''}</div>
        </div>
      `).join('') + `</div>`;
    } catch (e) {
      document.getElementById('activityArea').innerHTML = `<div class="empty-state">Could not load activity right now.</div>`;
    }
  }
  init();

  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('gb_theme');
  if (savedTheme) { document.body.setAttribute('data-theme', savedTheme); themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙'; }
  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    themeToggle.textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('gb_theme', next);
  });
</script>
</body>
</html>
