<style>
  :root{
    --paper:#EFEDE2; --paper-alt:#E6E2D3; --ink:#1F2A38; --ink-soft:#4A5563;
    --carbon-red:#B23A2E; --stamp-mustard:#C9922A; --ledger-green:#4C6B54;
    --line:#C9C4B2; --white:#FFFDF8; --mono:'JetBrains Mono', monospace; --sans:'Work Sans', sans-serif;
  }
  [data-theme="dark"]{
    --paper:#171A1E; --paper-alt:#1E2228; --ink:#ECE8DC; --ink-soft:#A9A79B;
    --carbon-red:#E0574A; --stamp-mustard:#E0AC4D; --ledger-green:#7FA98C;
    --line:#3A3E44; --white:#20242A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}
  .mono{font-family:var(--mono);}

  header.nav{position:sticky; top:0; z-index:50; background:var(--white); border-bottom:1px solid var(--line);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1080px; margin:0 auto;}
  .back-link{font-family:var(--mono); font-size:.82rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .brand{font-weight:700; font-size:.95rem;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.95rem;}

  .wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; text-align:center;}
  .content{max-width:460px;}
  .code{font-family:var(--mono); font-size:5rem; font-weight:700; color:var(--carbon-red); line-height:1; margin-bottom:8px;}
  .content h1{font-size:1.4rem; font-weight:700; margin-bottom:12px;}
  .content p{color:var(--ink-soft); font-size:.92rem; margin-bottom:28px; line-height:1.6;}

  .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:2px; font-weight:700; font-size:.86rem; border:none; cursor:pointer; text-decoration:none;}
  .btn-primary{background:var(--carbon-red); color:#fff;}
  .btn-ghost{background:transparent; border:1px solid var(--ink); color:var(--ink);}

  .quick-links{margin-top:36px; padding-top:24px; border-top:1px solid var(--line);}
  .quick-links p{font-family:var(--mono); font-size:.7rem; color:var(--ink-soft); letter-spacing:.08em; margin-bottom:12px;}
  .quick-links .links{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; font-size:.85rem; font-weight:600;}
  .quick-links a:hover{color:var(--carbon-red);}

  footer{padding:24px; text-align:center; border-top:1px solid var(--line);}
  footer p{color:var(--ink-soft); font-size:.8rem;}
</style>
</head>

  </div>

      </div>

<script>
  const MOON_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>';
  const SUN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';

  const toggle = document.getElementById('themeToggle');
  const body = document.body;
  try {
    const saved = localStorage.getItem('gb_theme');
    if(saved){ body.setAttribute('data-theme', saved); toggle.innerHTML = saved === 'dark' ? SUN_ICON : MOON_ICON; }
  } catch(e){}
  toggle.addEventListener('click', () => {
    const isDark = body.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    body.setAttribute('data-theme', next);
    toggle.innerHTML = isDark ? MOON_ICON : SUN_ICON;
    try { localStorage.setItem('gb_theme', next); } catch(e){}
  });
</script>
</body>
