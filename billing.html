<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing & Invoices — Going Beyond</title>
<meta name="description" content="View and download invoices for your Going Beyond orders.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EFEDE2; --paper-alt:#E6E2D3; --ink:#1F2A38; --ink-soft:#4A5563;
    --carbon-red:#B23A2E; --stamp-mustard:#C9922A; --ledger-green:#4C6B54;
    --line:#C9C4B2; --white:#FFFDF8; --mono:'JetBrains Mono', monospace; --sans:'Work Sans', sans-serif;
  }
  [data-theme="dark"]{
    --paper:#171A1E; --paper-alt:#1E2228; --ink:#ECE8DC; --ink-soft:#A9A79B;
    --carbon-red:#E0574A; --stamp-mustard:#E0AC4D; --ledger-green:#7FA98C;
    --line:#3A3E44; --white:#20242A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:var(--mono);}
  header.nav{position:sticky; top:0; z-index:50; background:var(--white); border-bottom:1px solid var(--line);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:900px; margin:0 auto;}
  .back-link{font-family:var(--mono); font-size:.82rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .brand{font-weight:700; font-size:.95rem;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.95rem;}
  .page-head{padding:32px 24px 20px; text-align:center;}
  .page-head .eyebrow{font-family:var(--mono); font-size:.7rem; color:var(--carbon-red); font-weight:700; letter-spacing:.08em; margin-bottom:10px;}
  .page-head h1{font-size:1.4rem; font-weight:700;}
  .wrap{max-width:700px; margin:0 auto; padding:0 24px 60px;}
  .empty-state{text-align:center; padding:50px 10px; color:var(--ink-soft); font-size:.9rem;}
  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:var(--mono); font-size:.85rem;}
  .bill-row{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); padding:14px 16px; margin-bottom:10px; background:var(--white);}
  .bill-row .num{font-size:.78rem; font-weight:700; color:var(--carbon-red); font-family:var(--mono);}
  .bill-row .svc{font-size:.9rem; margin-top:2px;}
  .bill-row .date{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
  .bill-row .amt{font-weight:700; font-size:.98rem; white-space:nowrap;}
  .status-pill{display:inline-block; padding:3px 8px; border-radius:20px; font-size:.68rem; font-weight:700; font-family:var(--mono); margin-top:4px;}
  .status-Paid{background:rgba(76,107,84,.15); color:var(--ledger-green);}
  .status-default{background:var(--paper-alt); color:var(--ink-soft);}
  .view-btn{font-family:var(--mono); font-size:.72rem; font-weight:700; padding:8px 12px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:2px; white-space:nowrap;}
  .pay-btn{background:var(--ledger-green); color:#fff; border-color:var(--ledger-green);}
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; align-items:center; justify-content:center; padding:20px;}
  .modal-box{background:var(--white); border:1px solid var(--line); padding:24px; max-width:340px; width:100%; text-align:center;}
  .modal-box img{width:100%; max-width:220px; margin:14px auto; display:block;}
  .modal-box .upi-id{font-family:var(--mono); font-weight:700; background:var(--paper-alt); padding:8px; margin:10px 0;}
  .btn{padding:12px 22px; border-radius:2px; font-weight:700; font-size:.86rem; border:none; cursor:pointer; background:var(--carbon-red); color:#fff;}
  footer{padding:32px 24px; text-align:center; border-top:1px solid var(--line);}
  footer p{color:var(--ink-soft); font-size:.8rem;}
</style>
</head>
<body data-theme="light">
<header class="nav">
  <div class="nav-inner">
    <a href="account.html" class="back-link">← My Account</a>
    <div class="brand">GOING BEYOND</div>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>
<div class="page-head">
  <div class="eyebrow">CLIENT ACCOUNT</div>
  <h1>Billing & Invoices</h1>
</div>
<div class="wrap">
  <div id="billingArea"><div class="loading">Loading your billing history…</div></div>
</div>

<div class="modal-overlay" id="payModal">
  <div class="modal-box">
    <h3 style="font-family:var(--mono); font-size:.9rem;">Scan to Pay</h3>
    <img id="payQrImg" src="" alt="UPI QR Code">
    <div class="upi-id" id="payUpiId"></div>
    <p class="date" style="margin-bottom:14px;">After paying, message us on WhatsApp with a screenshot so we can confirm quickly.</p>
    <button class="btn" onclick="document.getElementById('payModal').style.display='none'">Close</button>
  </div>
</div>
<footer><p>&copy; Going Beyond</p></footer>
<script>
  const SUPABASE_URL = "https://ysujkmmwwknjraofcixr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzdWprbW13d2tuanJhb2ZjaXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDQ4NzksImV4cCI6MjA5ODgyMDg3OX0.t8WpzFmQpE2kJj5w0XuVZV5QeeAcYCpJZspgqnJjNFU";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }

  let siteSettings = null;

  async function init(){
    const { data } = await sb.auth.getSession();
    const session = data.session;
    if (!session) { window.location.href = 'login.html?next=billing.html'; return; }

    try {
      const settingsRes = await fetch('/api/site-settings');
      const settingsResult = await settingsRes.json();
      if (settingsResult.success) siteSettings = settingsResult.settings;
    } catch {}

    try {
      const res = await fetch('/api/my-orders', { headers: { Authorization: `Bearer ${session.access_token}` } });
      const result = await res.json();
      const area = document.getElementById('billingArea');
      if (!res.ok || !result.success) { area.innerHTML = `<div class="empty-state">Could not load billing history right now.</div>`; return; }
      if (!result.orders.length) { area.innerHTML = `<div class="empty-state">No orders yet.</div>`; return; }

      sessionStorage.setItem('gb_orders_cache', JSON.stringify(result.orders));

      area.innerHTML = result.orders.map(o => `
        <div class="bill-row">
          <div>
            <div class="num">${o.order_number}</div>
            <div class="svc">${o.service}</div>
            <div class="date">${fmtDate(o.created_at)}</div>
            <span class="status-pill ${o.payment_status === 'Paid' ? 'status-Paid' : 'status-default'}">${o.payment_status}</span>
          </div>
          <div style="text-align:right;">
            <div class="amt">₹${o.total_price}</div>
            <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
              ${o.payment_status !== 'Paid' && siteSettings?.upi_qr_url ? `<button class="view-btn pay-btn" onclick="showPayModal()">Pay Now</button>` : ''}
              <a href="invoice.html?id=${o.id}" class="view-btn">View Invoice</a>
            </div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('billingArea').innerHTML = `<div class="empty-state">Could not load billing history right now.</div>`;
    }
  }
  init();

  function showPayModal(){
    document.getElementById('payQrImg').src = siteSettings.upi_qr_url;
    document.getElementById('payUpiId').textContent = siteSettings.upi_id || '';
    document.getElementById('payModal').style.display = 'flex';
  }

  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('gb_theme');
  if (savedTheme) { document.body.setAttribute('data-theme', savedTheme); themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙'; }
  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    themeToggle.textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('gb_theme', next);
  });
</script>
</body>
</html>
