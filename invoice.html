<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — Going Beyond</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EFEDE2; --ink:#1F2A38; --ink-soft:#4A5563; --carbon-red:#B23A2E; --line:#C9C4B2;
    --white:#FFFDF8; --mono:'JetBrains Mono', monospace; --sans:'Work Sans', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans);}
  .toolbar{display:flex; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); background:var(--white);}
  .toolbar a, .toolbar button{font-family:var(--mono); font-size:.8rem; font-weight:700; color:var(--ink); background:none; border:1px solid var(--line); padding:8px 14px; border-radius:2px; cursor:pointer; text-decoration:none;}
  .invoice-wrap{max-width:640px; margin:30px auto; padding:0 20px;}
  .invoice-card{background:var(--white); border:1px solid var(--line); padding:36px;}
  .inv-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:30px; padding-bottom:20px; border-bottom:2px solid var(--ink);}
  .inv-head .brand{font-size:1.3rem; font-weight:700;}
  .inv-head .tag{font-family:var(--mono); font-size:.7rem; color:var(--carbon-red); margin-top:4px;}
  .inv-head .meta{text-align:right; font-size:.82rem; color:var(--ink-soft);}
  .inv-head .meta strong{color:var(--ink); font-family:var(--mono);}
  .bill-to{margin-bottom:24px;}
  .bill-to .label{font-family:var(--mono); font-size:.7rem; color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;}
  table{width:100%; border-collapse:collapse; margin-bottom:20px;}
  th{text-align:left; font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); padding:8px 0; border-bottom:1px solid var(--line);}
  td{padding:12px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .total-row{display:flex; justify-content:flex-end; gap:20px; font-size:1.1rem; font-weight:700; padding-top:10px;}
  .footer-note{margin-top:30px; font-size:.76rem; color:var(--ink-soft); text-align:center;}
  .loading{text-align:center; padding:80px 20px; color:var(--ink-soft); font-family:var(--mono);}
  @media print{ .toolbar{display:none;} body{background:#fff;} .invoice-card{border:none;} }
</style>
</head>
<body>
<div class="toolbar">
  <a href="billing.html">← Back to Billing</a>
  <button onclick="window.print()">🖨 Print / Save as PDF</button>
</div>
<div class="invoice-wrap" id="invoiceWrap">
  <div class="loading">Loading invoice…</div>
</div>
<script>
  const SUPABASE_URL = "https://ysujkmmwwknjraofcixr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzdWprbW13d2tuanJhb2ZjaXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDQ4NzksImV4cCI6MjA5ODgyMDg3OX0.t8WpzFmQpE2kJj5w0XuVZV5QeeAcYCpJZspgqnJjNFU";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  function fmtDate(iso){ return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' }); }

  async function init(){
    const { data } = await sb.auth.getSession();
    const session = data.session;
    if (!session) { window.location.href = 'login.html?next=billing.html'; return; }

    const orderId = new URLSearchParams(window.location.search).get('id');
    let order = null;

    const cached = sessionStorage.getItem('gb_orders_cache');
    if (cached) {
      try { order = JSON.parse(cached).find(o => o.id === orderId); } catch {}
    }
    if (!order) {
      const res = await fetch('/api/my-orders', { headers: { Authorization: `Bearer ${session.access_token}` } });
      const result = await res.json();
      if (res.ok && result.success) order = result.orders.find(o => o.id === orderId);
    }

    const wrap = document.getElementById('invoiceWrap');
    if (!order) { wrap.innerHTML = '<div class="loading">Invoice not found.</div>'; return; }

    const user = session.user;
    const meta = user.user_metadata || {};

    wrap.innerHTML = `
      <div class="invoice-card">
        <div class="inv-head">
          <div>
            <div class="brand">GOING BEYOND</div>
            <div class="tag">FREELANCE DESIGN SERVICES</div>
          </div>
          <div class="meta">
            <div>Invoice for order</div>
            <strong>${order.order_number}</strong><br>
            ${fmtDate(order.created_at)}
          </div>
        </div>
        <div class="bill-to">
          <div class="label">Billed To</div>
          <div>${meta.full_name || user.email}</div>
          <div style="color:var(--ink-soft); font-size:.85rem;">${user.email}${meta.phone ? ' · ' + meta.phone : ''}</div>
        </div>
        <table>
          <thead><tr><th>Description</th><th>Qty</th><th style="text-align:right;">Amount</th></tr></thead>
          <tbody>
            <tr>
              <td>${order.service}${order.size ? ' (' + order.size + ')' : ''}</td>
              <td>${order.quantity}</td>
              <td style="text-align:right;">₹${order.total_price}</td>
            </tr>
          </tbody>
        </table>
        <div class="total-row"><span>Total</span><span>₹${order.total_price}</span></div>
        <div class="footer-note">Payment status: <strong>${order.payment_status}</strong> · Going Beyond, Burari, Delhi NCR · gauravadhikari9289@gmail.com</div>
      </div>
    `;
  }
  init();
</script>
</body>
</html>
