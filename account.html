<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Going Beyond</title>
<meta name="description" content="View your profile and order history with Going Beyond.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EFEDE2; --paper-alt:#E6E2D3; --ink:#1F2A38; --ink-soft:#4A5563;
    --carbon-red:#B23A2E; --stamp-mustard:#C9922A; --ledger-green:#4C6B54;
    --line:#C9C4B2; --white:#FFFDF8; --mono:'JetBrains Mono', monospace; --sans:'Work Sans', sans-serif;
  }
  [data-theme="dark"]{
    --paper:#171A1E; --paper-alt:#1E2228; --ink:#ECE8DC; --ink-soft:#A9A79B;
    --carbon-red:#E0574A; --stamp-mustard:#E0AC4D; --ledger-green:#7FA98C;
    --line:#3A3E44; --white:#20242A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:var(--mono);}

  header.nav{position:sticky; top:0; z-index:50; background:var(--white); border-bottom:1px solid var(--line);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:900px; margin:0 auto;}
  .back-link{font-family:var(--mono); font-size:.82rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .brand{font-weight:700; font-size:.95rem;}
  .nav-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.95rem;}
  .logout-btn{font-family:var(--mono); font-size:.76rem; font-weight:700; color:var(--carbon-red); border:1px solid var(--carbon-red); background:none; padding:8px 12px; border-radius:2px; cursor:pointer;}

  .page-head{padding:36px 24px 20px; text-align:center;}
  .page-head .eyebrow{font-family:var(--mono); font-size:.7rem; color:var(--carbon-red); font-weight:700; letter-spacing:.08em; margin-bottom:10px;}
  .page-head h1{font-size:1.5rem; font-weight:700;}
  .avatar-circle{
    width:64px; height:64px; border-radius:50%; background:var(--carbon-red); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
    font-family:var(--mono); font-size:1.3rem; font-weight:700; letter-spacing:.02em;
  }

  .card-head-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .card-head-row h2{margin-bottom:0;}
  .muted-small{font-size:.72rem; color:var(--ink-soft); font-weight:400;}
  .btn-small{padding:8px 16px; margin-top:0; font-size:.76rem;}
  .btn-outline{background:none; border:1px solid var(--line); color:var(--ink-soft);}

  .view-section{margin-bottom:22px;}
  .view-section:last-child{margin-bottom:0;}
  .view-section-title{font-family:var(--mono); font-size:.72rem; font-weight:700; color:var(--carbon-red); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);}
  .view-section:first-child .view-section-title{margin-top:0;}
  .view-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .view-grid-full{grid-template-columns:1fr 1fr;}
  @media(max-width:560px){.view-grid, .view-grid-full{grid-template-columns:1fr;}}
  .view-label{display:block; font-size:.72rem; font-family:var(--mono); color:var(--ink-soft); margin-bottom:3px;}
  .view-value{display:block; font-size:.92rem;}

  .wrap{max-width:900px; margin:0 auto; padding:0 24px 60px;}
  .card{background:var(--white); border:1px solid var(--line); padding:26px; margin-bottom:24px;}
  .card h2{font-size:1.05rem; font-weight:700; margin-bottom:16px; font-family:var(--mono);}

  .card-head-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .card-head-row h2{margin-bottom:0;}
  .muted-small{font-size:.72rem; color:var(--ink-soft); font-weight:400;}

  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:560px){.profile-grid{grid-template-columns:1fr;}}
  .profile-field label{display:block; font-size:.72rem; font-weight:700; margin-bottom:4px; font-family:var(--mono); color:var(--ink-soft);}
  .profile-field .val{font-size:.94rem; padding:9px 0;}

  .field label{display:block; font-size:.72rem; font-weight:700; margin-bottom:6px; font-family:var(--mono); color:var(--ink-soft);}
  input, select{
    width:100%; padding:10px 12px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font-family:var(--sans); font-size:.9rem; border-radius:2px;
  }
  input:disabled{opacity:.65; cursor:not-allowed;}
  input:focus, select:focus{outline:2px solid var(--carbon-red); outline-offset:1px;}
  select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%231F2A38' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; background-size:11px 7px; padding-right:34px;
  }
  [data-theme="dark"] select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23ECE8DC' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  }
  .btn{padding:12px 22px; border-radius:2px; font-weight:700; font-size:.86rem; border:none; cursor:pointer; background:var(--carbon-red); color:#fff; margin-top:16px;}
  .btn:disabled{opacity:.6; cursor:not-allowed;}
  .msg-box{display:none; font-size:.8rem; padding:10px 12px; margin-top:12px; border-left:4px solid; font-family:var(--mono);}
  .msg-box.error{display:block; background:var(--paper-alt); border-color:var(--carbon-red); color:var(--carbon-red);}
  .msg-box.success{display:block; background:var(--paper-alt); border-color:var(--ledger-green); color:var(--ledger-green);}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th{text-align:left; font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); padding:10px 8px; border-bottom:2px solid var(--line); white-space:nowrap;}
  td{padding:12px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}

  .status-pill{display:inline-block; padding:4px 10px; border-radius:20px; font-size:.72rem; font-weight:700; font-family:var(--mono);}
  .status-Delivered, .status-Paid{background:rgba(76,107,84,.15); color:var(--ledger-green);}
  .status-default{background:var(--paper-alt); color:var(--ink-soft);}

  .empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:.88rem;}
  .empty-state a{color:var(--carbon-red); font-weight:700;}

  .loading{text-align:center; padding:30px; color:var(--ink-soft); font-family:var(--mono); font-size:.82rem;}
  footer{padding:32px 24px; text-align:center; border-top:1px solid var(--line);}
  footer p{color:var(--ink-soft); font-size:.8rem;}
</style>
</head>
<body data-theme="light">

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="back-link">← Back to home</a>
    <div class="brand">GOING BEYOND</div>
    <div class="nav-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </div>
</header>

<div class="page-head">
  <div class="avatar-circle" id="avatarCircle">?</div>
  <div class="eyebrow">CLIENT ACCOUNT</div>
  <h1 id="headName">My Account</h1>
  <p class="muted-small" id="profSince"></p>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-head-row">
      <h2>Profile</h2>
      <button type="button" class="btn btn-small" id="editProfileBtn">Edit Profile</button>
    </div>

    <!-- VIEW MODE — plain, easy-to-read summary -->
    <div id="profileView">
      <div class="view-section">
        <div class="view-section-title">Basic Info</div>
        <div class="view-grid">
          <div><span class="view-label">Full Name</span><span class="view-value" id="vName">—</span></div>
          <div><span class="view-label">Email</span><span class="view-value" id="vEmail">—</span></div>
          <div><span class="view-label">Phone</span><span class="view-value" id="vPhone">—</span></div>
          <div><span class="view-label">Alt. WhatsApp</span><span class="view-value" id="vAltPhone">—</span></div>
        </div>
      </div>
      <div class="view-section">
        <div class="view-section-title">Preferences</div>
        <div class="view-grid">
          <div><span class="view-label">Contact Method</span><span class="view-value" id="vContactPref">—</span></div>
          <div><span class="view-label">Language</span><span class="view-value" id="vLanguage">—</span></div>
          <div><span class="view-label">Birthday</span><span class="view-value" id="vBirthday">—</span></div>
        </div>
      </div>
      <div class="view-section">
        <div class="view-section-title">Additional</div>
        <div class="view-grid view-grid-full">
          <div><span class="view-label">Address</span><span class="view-value" id="vAddress">—</span></div>
          <div><span class="view-label">Design Preferences</span><span class="view-value" id="vDesignPref">—</span></div>
        </div>
      </div>
    </div>

    <!-- EDIT MODE — same form as before, hidden until "Edit Profile" is clicked -->
    <form id="profileForm" style="display:none;">
      <div class="view-section-title" style="margin-top:4px;">Basic Info</div>
      <div class="profile-grid">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="profName" required>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="profEmail" disabled>
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="profPhone">
        </div>
        <div class="field">
          <label>Alternate WhatsApp Number</label>
          <input type="tel" id="profAltPhone" placeholder="If different from above">
        </div>
      </div>

      <div class="view-section-title">Preferences</div>
      <div class="profile-grid">
        <div class="field">
          <label>Preferred Contact Method</label>
          <select id="profContactPref">
            <option value="Email">Email</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Phone Call">Phone Call</option>
          </select>
        </div>
        <div class="field">
          <label>Language Preference</label>
          <select id="profLanguage">
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
            <option value="Hinglish">Hinglish (Mix)</option>
          </select>
        </div>
        <div class="field">
          <label>Birthday <span class="muted-small">(optional)</span></label>
          <input type="date" id="profBirthday">
        </div>
      </div>

      <div class="view-section-title">Additional</div>
      <div class="profile-grid">
        <div class="field" style="grid-column:1 / -1;">
          <label>Address <span class="muted-small">(optional)</span></label>
          <input type="text" id="profAddress" placeholder="For future printed/delivery orders">
        </div>
        <div class="field" style="grid-column:1 / -1;">
          <label>Design Preferences <span class="muted-small">(optional)</span></label>
          <input type="text" id="profDesignPref" placeholder="e.g. bold colors, minimal style — helps us on repeat orders">
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button type="submit" class="btn" id="profSaveBtn">Save Profile</button>
        <button type="button" class="btn btn-outline" id="cancelEditBtn">Cancel</button>
      </div>
      <div class="msg-box" id="profMsg"></div>
    </form>
  </div>

  <div class="card">
    <h2>Order History</h2>
    <div id="ordersArea"><div class="loading">Loading your orders…</div></div>
  </div>
</div>

<footer><p>&copy; Going Beyond</p></footer>

<script>
  const SUPABASE_URL = "https://ysujkmmwwknjraofcixr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzdWprbW13d2tuanJhb2ZjaXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDQ4NzksImV4cCI6MjA5ODgyMDg3OX0.t8WpzFmQpE2kJj5w0XuVZV5QeeAcYCpJZspgqnJjNFU";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function fmtDate(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  }

  async function init(){
    const { data } = await sb.auth.getSession();
    const session = data.session;
    if (!session) { window.location.href = 'login.html'; return; }

    const user = session.user;
    const meta = user.user_metadata || {};
    const name = meta.full_name || '';

    // Avatar initials — first letter of first two words
    const initials = name.trim() ? name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('') : (user.email || '?')[0].toUpperCase();
    document.getElementById('avatarCircle').textContent = initials;
    document.getElementById('headName').textContent = name || 'My Account';
    document.getElementById('profSince').textContent = 'Client since ' + fmtDate(user.created_at);

    // Fill edit-mode form
    document.getElementById('profName').value = name;
    document.getElementById('profEmail').value = user.email || '';
    document.getElementById('profPhone').value = meta.phone || '';
    document.getElementById('profAltPhone').value = meta.alt_phone || '';
    document.getElementById('profContactPref').value = meta.contact_pref || 'Email';
    document.getElementById('profLanguage').value = meta.language_pref || 'Hindi';
    document.getElementById('profBirthday').value = meta.birthday || '';
    document.getElementById('profAddress').value = meta.address || '';
    document.getElementById('profDesignPref').value = meta.design_pref || '';

    // Fill view-mode summary
    document.getElementById('vName').textContent = name || '—';
    document.getElementById('vEmail').textContent = user.email || '—';
    document.getElementById('vPhone').textContent = meta.phone || '—';
    document.getElementById('vAltPhone').textContent = meta.alt_phone || '—';
    document.getElementById('vContactPref').textContent = meta.contact_pref || 'Email';
    document.getElementById('vLanguage').textContent = meta.language_pref || 'Hindi';
    document.getElementById('vBirthday').textContent = meta.birthday ? fmtDate(meta.birthday) : '—';
    document.getElementById('vAddress').textContent = meta.address || '—';
    document.getElementById('vDesignPref').textContent = meta.design_pref || '—';

    try {
      const res = await fetch('/api/my-orders', {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      const result = await res.json();
      const area = document.getElementById('ordersArea');

      if (!res.ok || !result.success) {
        area.innerHTML = `<div class="empty-state">Could not load your orders right now. Please refresh the page.</div>`;
        return;
      }

      if (!result.orders.length) {
        area.innerHTML = `<div class="empty-state">You haven't placed any orders yet.<br><a href="order.html">Place your first order →</a></div>`;
        return;
      }

      const rows = result.orders.map(o => `
        <tr>
          <td class="mono">${o.order_number}</td>
          <td>${o.service}</td>
          <td>${o.quantity}</td>
          <td>₹${o.total_price}</td>
          <td><span class="status-pill ${o.status === 'Order Delivered' ? 'status-Delivered' : 'status-default'}">${o.status}</span></td>
          <td><span class="status-pill ${o.payment_status === 'Paid' ? 'status-Paid' : 'status-default'}">${o.payment_status}</span></td>
          <td>${fmtDate(o.created_at)}</td>
        </tr>
      `).join('');

      area.innerHTML = `
        <div class="table-scroll">
          <table>
            <thead><tr><th>Order ID</th><th>Service</th><th>Qty</th><th>Total</th><th>Status</th><th>Payment</th><th>Placed On</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    } catch (err) {
      document.getElementById('ordersArea').innerHTML = `<div class="empty-state">Could not load your orders right now. Please refresh the page.</div>`;
    }
  }
  init();

  const profileView = document.getElementById('profileView');
  const profileForm = document.getElementById('profileForm');
  document.getElementById('editProfileBtn').addEventListener('click', () => {
    profileView.style.display = 'none';
    profileForm.style.display = 'block';
  });
  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    profileForm.style.display = 'none';
    profileView.style.display = 'block';
    document.getElementById('profMsg').className = 'msg-box';
  });

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('profSaveBtn');
    const msg = document.getElementById('profMsg');
    btn.disabled = true; btn.textContent = 'Saving…'; msg.className = 'msg-box';

    const updated = {
      full_name: document.getElementById('profName').value.trim(),
      phone: document.getElementById('profPhone').value.trim(),
      alt_phone: document.getElementById('profAltPhone').value.trim(),
      contact_pref: document.getElementById('profContactPref').value,
      language_pref: document.getElementById('profLanguage').value,
      birthday: document.getElementById('profBirthday').value,
      address: document.getElementById('profAddress').value.trim(),
      design_pref: document.getElementById('profDesignPref').value.trim(),
    };

    const { error } = await sb.auth.updateUser({ data: updated });

    btn.disabled = false; btn.textContent = 'Save Profile';
    if (error) {
      msg.textContent = error.message; msg.className = 'msg-box error';
      return;
    }

    // Refresh view-mode summary + avatar/heading immediately, then switch back
    const initials = updated.full_name.trim() ? updated.full_name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('') : (document.getElementById('profEmail').value || '?')[0].toUpperCase();
    document.getElementById('avatarCircle').textContent = initials;
    document.getElementById('headName').textContent = updated.full_name || 'My Account';
    document.getElementById('vName').textContent = updated.full_name || '—';
    document.getElementById('vPhone').textContent = updated.phone || '—';
    document.getElementById('vAltPhone').textContent = updated.alt_phone || '—';
    document.getElementById('vContactPref').textContent = updated.contact_pref;
    document.getElementById('vLanguage').textContent = updated.language_pref;
    document.getElementById('vBirthday').textContent = updated.birthday ? fmtDate(updated.birthday) : '—';
    document.getElementById('vAddress').textContent = updated.address || '—';
    document.getElementById('vDesignPref').textContent = updated.design_pref || '—';

    msg.textContent = 'Profile saved!'; msg.className = 'msg-box success';
    setTimeout(() => {
      profileForm.style.display = 'none';
      profileView.style.display = 'block';
      msg.className = 'msg-box';
    }, 900);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('gb_theme');
  if (savedTheme) {
    document.body.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }
  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    themeToggle.textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('gb_theme', next);
  });
</script>
</body>
</html>
