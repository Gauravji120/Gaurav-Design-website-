<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Going Beyond</title>
<meta name="description" content="View your profile and order history with Going Beyond.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EFEDE2; --paper-alt:#E6E2D3; --ink:#1F2A38; --ink-soft:#4A5563;
    --carbon-red:#B23A2E; --stamp-mustard:#C9922A; --ledger-green:#4C6B54;
    --line:#C9C4B2; --white:#FFFDF8; --mono:'JetBrains Mono', monospace; --sans:'Work Sans', sans-serif;
  }
  [data-theme="dark"]{
    --paper:#171A1E; --paper-alt:#1E2228; --ink:#ECE8DC; --ink-soft:#A9A79B;
    --carbon-red:#E0574A; --stamp-mustard:#E0AC4D; --ledger-green:#7FA98C;
    --line:#3A3E44; --white:#20242A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:var(--mono);}

  header.nav{position:sticky; top:0; z-index:50; background:var(--white); border-bottom:1px solid var(--line);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:900px; margin:0 auto;}
  .back-link{font-family:var(--mono); font-size:.82rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .brand{font-weight:700; font-size:.95rem;}
  .nav-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.95rem;}
  .logout-btn{font-family:var(--mono); font-size:.76rem; font-weight:700; color:var(--carbon-red); border:1px solid var(--carbon-red); background:none; padding:8px 12px; border-radius:2px; cursor:pointer;}

  .page-head{padding:36px 24px 20px; text-align:center;}
  .page-head .eyebrow{font-family:var(--mono); font-size:.7rem; color:var(--carbon-red); font-weight:700; letter-spacing:.08em; margin-bottom:10px;}
  .page-head h1{font-size:1.5rem; font-weight:700;}

  .wrap{max-width:900px; margin:0 auto; padding:0 24px 60px;}
  .card{background:var(--white); border:1px solid var(--line); padding:26px; margin-bottom:24px;}
  .card h2{font-size:1.05rem; font-weight:700; margin-bottom:16px; font-family:var(--mono);}

  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:560px){.profile-grid{grid-template-columns:1fr;}}
  .profile-field label{display:block; font-size:.72rem; font-weight:700; margin-bottom:4px; font-family:var(--mono); color:var(--ink-soft);}
  .profile-field .val{font-size:.94rem; padding:9px 0;}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th{text-align:left; font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); padding:10px 8px; border-bottom:2px solid var(--line); white-space:nowrap;}
  td{padding:12px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}

  .status-pill{display:inline-block; padding:4px 10px; border-radius:20px; font-size:.72rem; font-weight:700; font-family:var(--mono);}
  .status-Delivered, .status-Paid{background:rgba(76,107,84,.15); color:var(--ledger-green);}
  .status-default{background:var(--paper-alt); color:var(--ink-soft);}

  .empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:.88rem;}
  .empty-state a{color:var(--carbon-red); font-weight:700;}

  .loading{text-align:center; padding:30px; color:var(--ink-soft); font-family:var(--mono); font-size:.82rem;}
  footer{padding:32px 24px; text-align:center; border-top:1px solid var(--line);}
  footer p{color:var(--ink-soft); font-size:.8rem;}
</style>
</head>
<body data-theme="light">

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="back-link">← Back to home</a>
    <div class="brand">GOING BEYOND</div>
    <div class="nav-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </div>
</header>

<div class="page-head">
  <div class="eyebrow">CLIENT ACCOUNT</div>
  <h1>My Account</h1>
</div>

<div class="wrap">
  <div class="card">
    <h2>Profile</h2>
    <div class="profile-grid">
      <div class="profile-field"><label>Name</label><div class="val" id="profName">—</div></div>
      <div class="profile-field"><label>Email</label><div class="val" id="profEmail">—</div></div>
      <div class="profile-field"><label>Phone</label><div class="val" id="profPhone">—</div></div>
      <div class="profile-field"><label>Client Since</label><div class="val" id="profSince">—</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Order History</h2>
    <div id="ordersArea"><div class="loading">Loading your orders…</div></div>
  </div>
</div>

<footer><p>&copy; Going Beyond</p></footer>

<script>
  const SUPABASE_URL = "https://ysujkmmwwknjraofcixr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzdWprbW13d2tuanJhb2ZjaXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDQ4NzksImV4cCI6MjA5ODgyMDg3OX0.t8WpzFmQpE2kJj5w0XuVZV5QeeAcYCpJZspgqnJjNFU";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function fmtDate(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  }

  async function init(){
    const { data } = await sb.auth.getSession();
    const session = data.session;
    if (!session) { window.location.href = 'login.html'; return; }

    const user = session.user;
    document.getElementById('profName').textContent = user.user_metadata?.full_name || '—';
    document.getElementById('profEmail').textContent = user.email || '—';
    document.getElementById('profPhone').textContent = user.user_metadata?.phone || '—';
    document.getElementById('profSince').textContent = fmtDate(user.created_at);

    try {
      const res = await fetch('/api/my-orders', {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      const result = await res.json();
      const area = document.getElementById('ordersArea');

      if (!res.ok || !result.success) {
        area.innerHTML = `<div class="empty-state">Could not load your orders right now. Please refresh the page.</div>`;
        return;
      }

      if (!result.orders.length) {
        area.innerHTML = `<div class="empty-state">You haven't placed any orders yet.<br><a href="order.html">Place your first order →</a></div>`;
        return;
      }

      const rows = result.orders.map(o => `
        <tr>
          <td class="mono">${o.order_number}</td>
          <td>${o.service}</td>
          <td>${o.quantity}</td>
          <td>₹${o.total_price}</td>
          <td><span class="status-pill ${o.status === 'Order Delivered' ? 'status-Delivered' : 'status-default'}">${o.status}</span></td>
          <td><span class="status-pill ${o.payment_status === 'Paid' ? 'status-Paid' : 'status-default'}">${o.payment_status}</span></td>
          <td>${fmtDate(o.created_at)}</td>
        </tr>
      `).join('');

      area.innerHTML = `
        <div class="table-scroll">
          <table>
            <thead><tr><th>Order ID</th><th>Service</th><th>Qty</th><th>Total</th><th>Status</th><th>Payment</th><th>Placed On</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    } catch (err) {
      document.getElementById('ordersArea').innerHTML = `<div class="empty-state">Could not load your orders right now. Please refresh the page.</div>`;
    }
  }
  init();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('gb_theme');
  if (savedTheme) {
    document.body.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }
  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    themeToggle.textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('gb_theme', next);
  });
</script>
</body>
</html>
